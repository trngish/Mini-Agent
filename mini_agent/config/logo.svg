      <rect x="0"  y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="9"  y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="27" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="54" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="54" width="9" height="9" fill="url(#textGrad)"/>
    </g>

    <!-- ===== A (slot 5: offset 270) ===== -->
    <g transform="translate(270, 0)">
      <rect x="9"  y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="27" y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="9"  y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="27" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="54" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="54" width="9" height="9" fill="url(#textGrad)"/>
    </g>

    <!-- ===== X (slot 6: offset 324) ===== -->
    <g transform="translate(324, 0)">
      <rect x="0"  y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="9"  y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="27" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="9"  y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="27" y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="54" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="54" width="9" height="9" fill="url(#textGrad)"/>
    </g>
  </g>

  <!-- Pixel diamond accent (bottom-right of text block) -->
  <g transform="translate(406, 384)">
    <rect x="18" y="0"  width="9" height="9" fill="url(#textGrad)" opacity="0.45"/>
    <rect x="9"  y="9"  width="9" height="9" fill="url(#textGrad)" opacity="0.55"/>
    <rect x="27" y="9"  width="9" height="9" fill="url(#textGrad)" opacity="0.55"/>
    <rect x="0"  y="18" width="9" height="9" fill="url(#textGrad)" opacity="0.65"/>
    <rect x="18" y="18" width="9" height="9" fill="url(#textGrad)" opacity="0.85"/>
    <rect x="36" y="18" width="9" height="9" fill="url(#textGrad)" opacity="0.65"/>
    <rect x="9"  y="27" width="9" height="9" fill="url(#textGrad)" opacity="0.55"/>
    <rect x="27" y="27" width="9" height="9" fill="url(#textGrad)" opacity="0.55"/>
    <rect x="18" y="36" width="9" height="9" fill="url(#textGrad)" opacity="0.45"/>
  </g>

  <!-- Subtle pixel dots row (bottom center) -->
  <g transform="translate(113, 414)" opacity="0.3">
    <rect x="0"   y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="16"  y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="32"  y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="48"  y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="64"  y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="80"  y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="96"  y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="112" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="128" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="144" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="160" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="176" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="192" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="208" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="224" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="240" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="256" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="272" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
    <rect x="288" y="0" width="6" height="6" rx="1" fill="url(#textGrad)"/>
  </g>
</svg>

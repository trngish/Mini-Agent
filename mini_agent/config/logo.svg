<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Horizontal grayscale gradient (light → dark) like OpenCode -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="10%" stop-color="#D1D5DB" />
      <stop offset="30%" stop-color="#9CA3AF" />
      <stop offset="55%" stop-color="#6B7280" />
      <stop offset="80%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>

    <!-- Ambient glow behind the mark -->
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4B5563" stop-opacity="0.15" />
      <stop offset="45%" stop-color="#1F2937" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0B0F19" rx="24" />

  <!-- Glow -->
  <circle cx="256" cy="240" r="210" fill="url(#glow)" />

  <!--
    Pixel Art "MINIMAX" — 5×7 grid per char, 9px per pixel, 9px gap between chars
    Char width: 5×9=45 | Gap: 9 | Total per slot: 54
    Text total: 7×54−9=369px | Start: x=72 | Center: (72+441)/2=256.5
  -->
  <g transform="translate(72, 224)">
    <!-- ===== M (slot 0: offset 0) ===== -->
    <g>
      <rect x="0"  y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="9"  y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="27" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="54" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="54" width="9" height="9" fill="url(#textGrad)"/>
    </g>

    <!-- ===== I (slot 1: offset 54) ===== -->
    <g transform="translate(54, 0)">
      <rect x="18" y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="54" width="9" height="9" fill="url(#textGrad)"/>
    </g>

    <!-- ===== N (slot 2: offset 108) ===== -->
    <g transform="translate(108, 0)">
      <rect x="0"  y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="9"  y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="27" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="0"  y="54" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="36" y="54" width="9" height="9" fill="url(#textGrad)"/>
    </g>

    <!-- ===== I (slot 3: offset 162) ===== -->
    <g transform="translate(162, 0)">
      <rect x="18" y="0"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="9"  width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="18" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="27" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="36" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="45" width="9" height="9" fill="url(#textGrad)"/>
      <rect x="18" y="54" width="9" height="9" fill="url(#textGrad)"/>

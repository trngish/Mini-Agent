[project]
name = "mini-agent"
version = "0.1.0"
description = "Minimal single agent demo with basic file tools and MCP support"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Mini Agent Team"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "requests>=2.31,<3",
    "tiktoken>=0.5,<1",
    "prompt-toolkit>=3.0,<4",
    "anthropic>=0.39,<1",
    "openai>=1.57,<2",
    "agent-client-protocol>=0.6,<1",
    "textual>=8.0,<9",
    "Pillow>=10.0,<11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "pytest-asyncio==0.21.0",
    "pytest-cov>=4.0,<8",
    "pytest-xdist>=3.0,<4",
    "ruff>=0.1,<1",
    "mypy>=1.0,<2",
    "pre-commit>=3.0,<5",
    "pip-audit>=2.0,<3",
    "bandit>=1.0,<2",
    "types-pyyaml>=6.0.12.20260518",
]
security = [
    "pip-audit>=2.0,<3",
    "bandit>=1.0,<2",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"
mini-agent-acp = "mini_agent.acp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mini_agent*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
mini_agent = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "workspace/.pytest_cache"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "mock: marks tests as mock-based (no external deps)",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["mini_agent/skills", "mini_agent/acp", "scripts", "stress_test.py", "string_utils.py", "test_string_utils.py", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "PTH"]
ignore = ["B905", "SIM117", "ARG001", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "N803"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
# Strict mode enabled for better type safety
strict = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["skills/", "dist/", "workspace/", "acp/"]

[tool.bandit]
exclude_dirs = ["tests", "skills", ".venv"]
skips = ["B101", "B105", "B110", "B112", "B311", "B404", "B603", "B607"]

[tool.coverage.run]
source = ["mini_agent"]
omit = ["mini_agent/skills/*", "mini_agent/acp/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]

[dependency-groups]
dev = [
    "pytest>=7.0,<9",
    "pytest-asyncio==0.21.0",
    "pytest-cov>=4.0,<8",
    "pytest-xdist>=3.0,<4",
    "ruff>=0.1,<1",
    "mypy>=1.0,<2",
    "pre-commit>=3.0,<5",
    "pip-audit>=2.0,<3",
    "bandit>=1.0,<2",
    "types-pyyaml>=6.0.12.20260518",
]
